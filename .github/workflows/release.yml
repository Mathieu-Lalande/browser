# Builds the installers on the three OSes and publishes them as a GitHub Release (ADR-023).
# Triggered by pushing a `v*` tag (`npm run release:version -- <version>` then `git push --follow-tags`)
# or manually from the Actions tab with a version number.
# Code signing is optional: without the secrets below, the packages are built unsigned.
#   Windows: WIN_CSC_LINK (base64 .pfx or https URL) + WIN_CSC_KEY_PASSWORD
#   macOS:   CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD (signing only, no notarization)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le « v » (ex. 0.3.0). Le tag v<version> est créé sur le commit choisi."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Resolve the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version invalide : '$version' (attendu : 1.2.3 ou 1.2.3-beta.1)"
            exit 1
          fi
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$version" ]; then
            echo "::warning::package.json est en $current : les paquets seront construits en $version."
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Targets and architectures come from the `build` key of package.json:
          # NSIS + zip (x64, arm64), dmg (arm64, x64), AppImage + deb (x64).
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the package version
        shell: bash
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"
      # Signing secrets are optional: they are exported only when they exist, otherwise
      # certificate discovery is turned off and electron-builder produces unsigned packages.
      - name: Configure code signing (optional)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          signed=false
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            {
              echo "WIN_CSC_LINK=$WIN_CSC_LINK"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            signed=true
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ]; then
            {
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            signed=true
          fi
          if [ "$signed" = false ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Ad-hoc signature: without any signature, Apple Silicon reports the app as "damaged";
              # ad-hoc signed, Gatekeeper only asks for a right click > Open.
              npm pkg set build.mac.identity=-
              npm pkg set build.mac.hardenedRuntime=false --json
            fi
            echo "Pas de certificat : paquets non signés."
          fi
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Browser ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          body: |
            ## Installer Browser

            | Système | Fichier |
            | --- | --- |
            | Windows 10/11 (x64) | `Browser-Setup-${{ needs.prepare.outputs.version }}-x64.exe` |
            | Windows sur ARM | `Browser-Setup-${{ needs.prepare.outputs.version }}-arm64.exe` |
            | Windows, version portable | `Browser-${{ needs.prepare.outputs.version }}-win-x64.zip` |
            | macOS (Apple Silicon) | `Browser-${{ needs.prepare.outputs.version }}-mac-arm64.dmg` |
            | macOS (Intel) | `Browser-${{ needs.prepare.outputs.version }}-mac-x64.dmg` |
            | Linux | `.AppImage` ou `.deb` |

            Les paquets ne sont pas encore signés : Windows SmartScreen affiche « Windows a protégé votre
            ordinateur » (« Informations complémentaires » puis « Exécuter quand même ») et macOS demande
            un clic droit puis « Ouvrir ». Empreintes SHA-256 : `SHA256SUMS.txt`.
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
