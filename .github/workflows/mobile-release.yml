name: Mobile release

# Store builds of the mobile app with EAS (docs/INSTALL.md, section 2.3): builds iOS and Android
# in Expo's cloud and submits them (TestFlight, Play internal testing). Manual only. Without the
# EXPO_TOKEN secret, the job says so and stops successfully.
#
# Secrets: EXPO_TOKEN (required). Optional, for --auto-submit: ASC_APP_ID and APPLE_TEAM_ID (iOS;
# the App Store Connect API key itself is stored on EAS by `eas credentials`), and
# GOOGLE_SERVICE_ACCOUNT_JSON (Android, the JSON key's content). EAS_PROJECT_ID if app.json has no
# extra.eas.projectId.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme"
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: "Envoyer aux stores (TestFlight / test interne Play)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - name: Check for the Expo token
        id: token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::Secret EXPO_TOKEN absent : rien à construire (voir docs/INSTALL.md, section 2.3)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: |
          npm ci --prefix .. --ignore-scripts
          npm ci
          npm install --global eas-cli@16
      - name: Submit settings from secrets
        if: steps.token.outputs.present == 'true' && inputs.submit
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p secrets
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > secrets/google-play-service-account.json
          fi
          if [ -n "$ASC_APP_ID" ]; then
            jq --arg app "$ASC_APP_ID" --arg team "$APPLE_TEAM_ID" \
              '.submit.production.ios.ascAppId = $app | if $team != "" then .submit.production.ios.appleTeamId = $team else . end' \
              eas.json > eas.json.tmp && mv eas.json.tmp eas.json
          fi
      - name: Build${{ inputs.submit && ' and submit' || '' }}
        if: steps.token.outputs.present == 'true'
        run: |
          eas build --platform "${{ inputs.platform }}" --profile production --non-interactive \
            ${{ inputs.submit && '--auto-submit' || '' }}
      - name: Remove the service account key
        if: always() && steps.token.outputs.present == 'true'
        run: rm -rf secrets
