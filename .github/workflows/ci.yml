# Checks every push to master and every pull request; on master, also packages and smoke-tests Linux.
# Windows and macOS packages (10x the minutes for macOS) are built only on a manual run (workflow_dispatch).
# Auto-update and code signing are not set up (see docs/ROADMAP.md and ADR-015).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:cycles
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
      # The e2e fixtures launch Electron with --no-sandbox (no setuid sandbox on CI runners).
      - run: xvfb-run -a npx playwright test
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  server:
    name: Sync server (typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    name: Package (${{ matrix.os }})
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Unsigned builds: no certificate lookup on macOS/Windows.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:dir
      # Smoke test of the packaged (asar, fused) app: fuses, archive contents, starts and browses.
      - name: Smoke test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test packaging
        env:
          BROWSER_PACKAGED: release/linux-unpacked/browser
      # Packages are kept only for manual runs, and briefly: artifact storage counts against the free quota.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: browser-${{ runner.os }}
          path: |
            release/*-unpacked/
            release/mac*/
          retention-days: 3
          if-no-files-found: error
