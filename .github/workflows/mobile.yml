name: Mobile

on:
  push:
    paths: ["mobile/**", "src/shared/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "src/shared/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_OFFLINE: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
      - name: Bundle for Android (Metro + Hermes)
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle for iOS (Metro + Hermes)
        run: npx expo export --platform ios --output-dir dist/ios
