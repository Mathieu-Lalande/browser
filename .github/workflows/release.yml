# Builds the installers on the three OSes and publishes them as a GitHub Release (ADR-023).
# Triggered by pushing a `v*` tag (`npm run release:version -- <version>` then `git push --follow-tags`)
# or manually from the Actions tab with a version number.
# Code signing is optional: without the secrets below, the packages are built unsigned (docs/INSTALL.md).
#   Windows, Azure Trusted Signing (preferred, ADR-040): AZURE_TENANT_ID, AZURE_CLIENT_ID,
#            AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#            AZURE_CERTIFICATE_PROFILE, AZURE_PUBLISHER_NAME
#   Windows, classic certificate: WIN_CSC_LINK (base64 .pfx or https URL) + WIN_CSC_KEY_PASSWORD
#   Widevine VMP (castLabs EVS, Windows and macOS): EVS_ACCOUNT_NAME + EVS_PASSWD
#   macOS:   CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD (signing only, no notarization)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le « v » (ex. 0.3.0). Le tag v<version> est créé sur le commit choisi."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Resolve the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version invalide : '$version' (attendu : 1.2.3 ou 1.2.3-beta.1)"
            exit 1
          fi
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$version" ]; then
            echo "::warning::package.json est en $current : les paquets seront construits en $version."
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Targets and architectures come from the `build` key of package.json:
          # NSIS + zip (x64, arm64), dmg + zip (arm64, x64), AppImage + deb (x64).
          # Each OS also writes its auto-update metadata (latest.yml, latest-mac.yml,
          # latest-linux.yml) and the .blockmap files used for differential downloads (ADR-030).
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the package version
        shell: bash
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"
      # Signing secrets are optional: they are exported only when they exist, otherwise
      # certificate discovery is turned off and electron-builder produces unsigned packages.
      - name: Configure code signing (optional)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          signed=false
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
            # Azure Trusted Signing (ADR-040): electron-builder signs through Invoke-TrustedSigning,
            # authenticated by the AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET environment variables.
            # publisherName (the certificate's CN) is also written to app-update.yml: electron-updater
            # then refuses an update not signed by that publisher.
            npm pkg set build.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
            npm pkg set build.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
            npm pkg set build.win.azureSignOptions.certificateProfileName="$AZURE_CERTIFICATE_PROFILE"
            npm pkg set build.win.azureSignOptions.publisherName="$AZURE_PUBLISHER_NAME"
            {
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            } >> "$GITHUB_ENV"
            signed=true
            echo "Signature Windows : Azure Trusted Signing."
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            # Classic certificate (.pfx): electron-builder reads the publisher name from it.
            {
              echo "WIN_CSC_LINK=$WIN_CSC_LINK"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            signed=true
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$CSC_LINK" ]; then
            {
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            signed=true
          fi
          if [ "$signed" = false ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Ad-hoc signature: without any signature, Apple Silicon reports the app as "damaged";
              # ad-hoc signed, Gatekeeper only asks for a right click > Open.
              npm pkg set build.mac.identity=-
              npm pkg set build.mac.hardenedRuntime=false --json
            fi
            echo "Pas de certificat : paquets non signés."
          fi
      # castLabs EVS VMP signing (Widevine in production, ADR-040): only with the EVS secrets,
      # Windows and macOS (Linux needs none). The electron-builder hooks (scripts/vmp-sign.cjs)
      # sign the packaged app; without the secrets they do nothing.
      - name: Configure VMP signing (optional)
        id: vmp
        if: runner.os != 'Linux'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -n "$EVS_ACCOUNT_NAME" ] && [ -n "$EVS_PASSWD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de compte castLabs EVS : paquets non signés VMP (Widevine refusé par Netflix & co. en production)."
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.vmp.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install castLabs EVS
        if: steps.vmp.outputs.enabled == 'true'
        run: python -m pip install --upgrade castlabs-evs
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.platform }} --publish never
        env:
          EVS_ACCOUNT_NAME: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_PASSWD || '' }}
          EVS_PYTHON: python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Browser ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          body: |
            ## Installer Browser

            | Système | Fichier |
            | --- | --- |
            | Windows 10/11 (x64) | `Browser-Setup-${{ needs.prepare.outputs.version }}-x64.exe` |
            | Windows sur ARM | `Browser-Setup-${{ needs.prepare.outputs.version }}-arm64.exe` |
            | Windows, version portable | `Browser-${{ needs.prepare.outputs.version }}-win-x64.zip` |
            | macOS (Apple Silicon) | `Browser-${{ needs.prepare.outputs.version }}-mac-arm64.dmg` |
            | macOS (Intel) | `Browser-${{ needs.prepare.outputs.version }}-mac-x64.dmg` |
            | Linux | `.AppImage` ou `.deb` |

            Les paquets ne sont pas encore signés : Windows SmartScreen affiche « Windows a protégé votre
            ordinateur » (« Informations complémentaires » puis « Exécuter quand même ») et macOS demande
            un clic droit puis « Ouvrir ». Empreintes SHA-256 : `SHA256SUMS.txt`.

            Mises à jour automatiques : Windows (installateur) et Linux (AppImage) se mettent à jour
            depuis l'application. Sur macOS, tant que l'app n'est pas signée, la mise à jour se fait à la
            main depuis cette page. Les fichiers `latest*.yml` et `.blockmap` servent à ces mises à jour.
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
