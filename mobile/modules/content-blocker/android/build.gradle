plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.contentblocker'
version = '1.0.0'

android {
  namespace "expo.modules.contentblocker"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
// src/main/assets/blocklists/network.json comes from scripts/build-blocklists.mjs (postinstall), never committed.
